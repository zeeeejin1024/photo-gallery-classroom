<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>摄影作品展示页</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<header><p class="eyebrow">PHOTO NOTES · 课堂演示项目</p><h1>摄影作品展示页</h1><p id="intro">记录日常风景</p><p class="note">下方均为教学示意图，用来观察项目文件与网页的关系。</p></header>
<main><nav aria-label="作品分类"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="landscape" aria-pressed="false">风景</button><button type="button" data-filter="street" aria-pressed="false">街景</button></nav>
